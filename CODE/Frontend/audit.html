<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Audit Trail</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            margin: 0;
            padding: 40px;
            color: #26332e;
        }

        .audit-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 18px;
        }

        h1 {
            margin-top: 0;
        }

        .audit-description {
            color: #66726d;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 14px;
            background: #f2f5f3;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e8e6;
            vertical-align: top;
        }

        .action-label {
            font-weight: 600;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 16px;
            border: 1px solid #5f7f70;
            border-radius: 8px;
            color: #365848;
            text-decoration: none;
        }

        .message {
            margin-top: 20px;
            color: #9c3e34;
        }
    </style>
</head>

<body>

    <div class="audit-container">

        <a
            href="index.html"
            class="back-button">
            Back
        </a>

        <h1>Audit Trail</h1>

        <p class="audit-description">
            Read-only history of important system actions.
        </p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Record Type</th>
                    <th>Record ID</th>
                    <th>Old Value</th>
                    <th>New Value</th>
                    <th>Timestamp</th>
                </tr>
            </thead>

            <tbody id="auditList">
            </tbody>
        </table>

        <p
            id="auditMessage"
            class="message">
        </p>

    </div>

    <script src="audit.js"></script>

</body>
</html>
