<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserve Health - Login</title>

    <!-- Links the login page styling -->
    <link rel="stylesheet" href="css/privacy.css">
</head>

<body>

    <!-- Main login page -->
    <div class="page">

        <div class="card">

            <!-- Reserve Health logo and heading -->
            <div class="brand">
                <img src="Images/logo.png" alt="Reserve Health logo">

                <h1>Reserve Health</h1>

                <p>Clinical management portal</p>
            </div>

            <h2>Login</h2>

            <!-- Login form for the user -->
            <form id="login-form">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <!-- Shows the email error message -->
                <span
                    id="login-email-error"
                    class="text-danger">
                </span>

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <!-- Shows the password error message -->
                <span
                    id="login-password-error"
                    class="text-danger">
                </span>

                <button type="submit">
                    Login
                </button>

            </form>

            <!-- Takes new users to the sign up page -->
            <p class="account-link">

                Don't have an account?

                <a href="signup.html">
                    Sign up
                </a>

            </p>

        </div>

    </div>

    <!-- Connects the JavaScript file -->
    <script src="privacy.js"></script>

</body>

</html>
