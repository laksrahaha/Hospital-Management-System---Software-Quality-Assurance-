<!-- main dashboard for the reserve health system -->
<!-- dashboard content is shown according to the logged-in staff role -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Reserve Health - Dashboard
    </title>

    <link
        rel="stylesheet"
        href="css/shared.css">

    <link
        rel="stylesheet"
        href="css/dashboard.css">
</head>

<body>

<header class="topbar">

    <div class="topbar-left">

        <div class="logo-box">
            RH
        </div>

        <div class="brand-details">

            <h1>
                Reserve Health
            </h1>

            <p>
                Clinical Coordination System
            </p>

        </div>

    </div>

    <div class="topbar-right">

        <div class="staff-details">

            <span
                class="staff-name"
                id="staff-name">
            </span>

            <span
                class="role"
                id="staff-role">
            </span>

        </div>

        <button
            class="logout-button"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>


<nav
    class="main-nav"
    id="main-navigation">

    <a
        href="index.html"
        class="active">

        Dashboard

    </a>

</nav>


<main class="dashboard-page">

    <section class="dashboard-heading">

        <p class="small-label">
            Clinical Overview
        </p>

        <h2>
            Dashboard
        </h2>

        <p id="dashboard-description">
        </p>

    </section>


    <section
        class="dashboard-cards"
        id="dashboard-cards">
    </section>

</main>


<script>

const storedUser =
    sessionStorage.getItem(
        "reserveHealthUser"
    );

if (!storedUser) {

    window.location.href =
        "login.html";

    throw new Error(
        "Authentication required."
    );
}

const currentUser =
    JSON.parse(storedUser);

if (!currentUser.token) {

    sessionStorage.removeItem(
        "reserveHealthUser"
    );

    window.location.href =
        "login.html";

    throw new Error(
        "Authentication required."
    );
}


document
    .getElementById(
        "staff-name"
    )
    .textContent =
    currentUser.name;

document
    .getElementById(
        "staff-role"
    )
    .textContent =
    currentUser.role;


const navigation =
    document.getElementById(
        "main-navigation"
    );

const dashboardCards =
    document.getElementById(
        "dashboard-cards"
    );

const dashboardDescription =
    document.getElementById(
        "dashboard-description"
    );


if (
    currentUser.role ===
    "Doctor"
) {

    navigation.innerHTML += `
        <a href="patient.html">
            Patients
        </a>

        <a href="referrals.html">
            Referrals
        </a>

        <a href="audit.html">
            Audit Trail
        </a>
    `;

    dashboardDescription.textContent =
        "View patient, referral and system activity from one place.";

    dashboardCards.innerHTML = `
        <a
            href="patient.html"
            class="dashboard-card">

            <span class="dashboard-card-label">
                Patient Management
            </span>

            <h3>
                Patients
            </h3>

            <p>
                View, add and manage patient records.
            </p>

        </a>


        <a
            href="referrals.html"
            class="dashboard-card">

            <span class="dashboard-card-label">
                Referral Management
            </span>

            <h3>
                Referrals
            </h3>

            <p>
                Create and manage clinical referrals.
            </p>

        </a>


        <a
            href="audit.html"
            class="dashboard-card">

            <span class="dashboard-card-label">
                System History
            </span>

            <h3>
                Audit Trail
            </h3>

            <p>
                Review recorded system actions and changes.
            </p>

        </a>
    `;
}

else if (
    currentUser.role ===
    "Lab Technician"
) {

    navigation.innerHTML += `
        <a href="test-requests.html">
            Test Requests
        </a>
    `;

    dashboardDescription.textContent =
        "View and manage laboratory test requests.";

    dashboardCards.innerHTML = `
        <a
            href="test-requests.html"
            class="dashboard-card">

            <span class="dashboard-card-label">
                Laboratory
            </span>

            <h3>
                Test Requests
            </h3>

            <p>
                View outstanding requests and enter laboratory results.
            </p>

        </a>
    `;
}

else {

    sessionStorage.removeItem(
        "reserveHealthUser"
    );

    window.location.href =
        "login.html";
}


function logout() {

    sessionStorage.removeItem(
        "reserveHealthUser"
    );

    window.location.href =
        "login.html";
}

</script>

</body>

</html>
