@page
@model HospitalManagementSystem.Pages.LoginModel

<style>
    /* Login page only - does not affect the Home page */

    .login-page {
        background-color: #FFD6A3;
        min-height: 650px;
        padding: 55px 20px 100px 20px;
        text-align: center;
    }

    .login-brand {
        color: #826849;
        font-size: 36px;
        font-weight: 600;
        margin-bottom: 25px;
        text-align: center;
    }

    .login-logo {
        width: 110px;
        height: auto;
        display: block;
        margin: 0 auto 12px auto;
        border-radius: 50%;
    }

    .login-card {
        max-width: 420px;
        margin: 0 auto;
        background-color: #E8D7C3;
        padding: 40px;
        border-radius: 18px;
        text-align: left;
    }

    .login-card h2 {
        color: #4F473C;
        text-align: center;
        margin-bottom: 30px;
    }

    .login-card label {
        display: block;
        color: #4F473C;
        margin-bottom: 7px;
        font-weight: 500;
    }

    .login-card input {
        width: 100%;
        padding: 11px;
        border: 1px solid #826849;
        border-radius: 8px;
        margin-bottom: 20px;
        box-sizing: border-box;
    }

    .login-card button {
        width: 100%;
        padding: 12px;
        background-color: #826849;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .login-card button:hover {
        background-color: #4F473C;
    }

    footer {
        position: static !important;
        line-height: normal !important;
        padding: 20px 0;
    }
</style>

<div class="login-page">

    <div class="login-brand">

        <img src="/images/reserve-health-logo.png"
             alt="Reserve Health logo"
             class="login-logo" />

        <div>Reserve Health</div>

    </div>

    <div class="login-card">

        <h2>Login</h2>

        <form method="post">

            <div>
                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       name="email" />
            </div>

            <div>
                <label for="password">Password</label>

                <input type="password"
                       id="password"
                       name="password" />
            </div>

            <button type="submit">Login</button>

        </form>

    </div>

</div>
