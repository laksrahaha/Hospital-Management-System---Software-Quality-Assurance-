name: ReserveHealth CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ReserveHealth/ReserveHealth.slnx

      - name: Build solution
        run: >
          dotnet build ReserveHealth/ReserveHealth.slnx
          --configuration Release
          --no-restore

      - name: Run automated tests
        run: >
          dotnet test ReserveHealth/ReserveHealth.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=ReserveHealth-TestResults.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReserveHealth-TestResults
          path: TestResults