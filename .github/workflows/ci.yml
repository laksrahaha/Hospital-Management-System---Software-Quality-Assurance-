name: ReserveHealth CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433

    env:
      ConnectionStrings__DefaultConnection: >-
        Server=localhost,1433;
        Database=ReserveHealthDb;
        User Id=sa;
        Password=${{ secrets.CI_SQL_PASSWORD }};
        TrustServerCertificate=True;
        Encrypt=False;

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ReserveHealth/ReserveHealth.slnx

      - name: Build solution
        run: >
          dotnet build ReserveHealth/ReserveHealth.slnx
          --configuration Release
          --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Wait for SQL Server
        shell: bash
        run: |
          echo "Waiting for SQL Server..."
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi

            sleep 2
          done

          echo "SQL Server did not become ready."
          exit 1

      - name: Create CI database from migrations
        run: >
          dotnet ef database update
          --project CODE/Backend/ReserveHealth.Api/ReserveHealth.Api.csproj

      - name: Run automated tests
        run: >
          dotnet test ReserveHealth/ReserveHealth.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=ReserveHealth-TestResults.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReserveHealth-TestResults
          path: TestResults